name: Run BATS Tests

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: BATS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Use a recent LTS version

      - name: Install BATS and helpers
        run: |
          npm install -g bats
          npm install -g bats-assert
          npm install -g bats-support
          npm install -g bats-mock

      - name: Run BATS tests
        env:
          TERM: xterm
        run: |
          # Set the plugin path to the global npm root directory
          # (required to run the 'load' command in the BATS tests)
          export BATS_PLUGIN_PATH="$(npm root -g)"

          # Run all .bats files in the 'tests' directory
          bats -r tests
